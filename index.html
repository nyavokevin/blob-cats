<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Blob's pond</title>
  <meta name="description" content="A herd of round cats living around a dinosaur skull pond. Feed them, pet them, change the weather.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Figtree:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.7.6/build/index.module.js"
      }
    }
  </script>
  <script src="assets/dino-data.js"></script>
</head>
<body>
  <canvas id="scene" aria-label="A pond around a dinosaur skull where round white cats live. Click the ground to send them there."></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <header class="hud-top">
    <h1 class="wordmark">blob</h1>
    <div class="wx-card" id="wx-card">
      <span class="wx-icon" id="wx-icon" aria-hidden="true"></span>
      <div class="wx-text">
        <p class="wx-title" id="wx-title">Checking the sky</p>
        <p class="wx-line" id="status" aria-live="polite">One moment…</p>
      </div>
    </div>
  </header>

  <aside class="quests" id="quests" aria-labelledby="quests-title">
    <button type="button" class="quests-head" id="quests-toggle" aria-expanded="true" aria-controls="quest-body">
      <span class="quests-title" id="quests-title">Objectives</span>
      <span class="quests-count" id="quest-count">0 of 8</span>
    </button>
    <div class="quest-body" id="quest-body">
      <div class="meter" aria-hidden="true"><span id="quest-meter"></span></div>
      <ul class="quest-list" id="quest-list"></ul>
      <div class="quests-foot">
        <p class="fish-score"><span class="fish-dot" aria-hidden="true"></span><span id="fish-count">0</span> fish eaten</p>
        <button type="button" class="link-btn" id="reset">Start over</button>
      </div>
    </div>
  </aside>

  <p class="hint" id="hint">Click the ground to send the herd. Hold on a cat to pet it.</p>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <nav class="dock" aria-label="Herd controls">
    <div class="group" role="group" aria-label="Actions">
      <button type="button" data-act="jump" title="Space">Jump</button>
      <button type="button" data-act="roll" title="R">Roll</button>
      <button type="button" data-act="dance" title="D">Dance</button>
      <button type="button" data-act="gather" title="G">Gather</button>
      <button type="button" data-act="scatter">Scatter</button>
    </div>
    <div class="group" role="group" aria-label="Number of cats">
      <span class="label">Cats</span>
      <button type="button" class="icon-btn" id="less" aria-label="Fewer cats">−</button>
      <span class="count" id="count" aria-live="polite">8</span>
      <button type="button" class="icon-btn" id="more" aria-label="More cats">+</button>
    </div>
    <div class="group wx-pick" role="group" aria-label="Weather" id="wx-pick"></div>
  </nav>

  <div class="loading" id="loading">Filling the pond…</div>

  blink: faceCanvas(g => { whiskersNose(g); brows(g); closedEyes(g); chevron(g); }),

function chaikin(pts, n) {
  for (let k = 0; k < n; k++) {
    const out = [pts[0]];

function updateFish(t, dt) {

  for (let i = fishes.length - 1; i >= 0; i--) {
    const f = fishes[i], u = f.userData; u.t += dt;
    const pop = Math.min(1, u.t / 0.4);
    u.fish.position.y = 0.32 + Math.sin(t * 3 + i) * 0.06;
    u.fish.rotation.y = t * 1.6 + i; u.fish.rotation.z = Math.sin(t * 6 + i) * 0.25;
    u.fish.scale.setScalar(easeOut(pop) * 1.15);
    for (const c of herd) {

      if (dx * dx + dz * dz < 0.16 && Math.abs(c.pos.y - f.position.y) < 0.7) { eatFish(f, c); fishes.splice(i, 1); break; }

  let best = null, bd = maxD * maxD;
  for (const f of fishes) { const d = c.pos.distanceToSquared(f.position); if (d < bd) { bd = d; best = f; } }
  return best;
}

const QUESTS = [
  { id: 'fish',    text: 'Feed the herd 10 fish', goal: 10 },

  { id: 'swim',    text: 'Send the whole herd for a swim', goal: 1 },
  { id: 'roll',    text: 'Make 5 cats roll at the same time', goal: 1 },
  { id: 'cheer',   text: 'Cheer up a sulking cat with a fish in the rain', goal: 1 },
  { id: 'weather', text: 'Try all 7 kinds of weather', goal: 7 },

const STORE = 'blob-pond-v1';
const progress = (() => {
  try { const p = JSON.parse(localStorage.getItem(STORE)); if (p && p.done) return { done: p.done, fish: p.fish || 0, weathers: p.weathers || [] }; } catch (e) { /* storage blocked */ }
  return { done: {}, fish: 0, weathers: [] };
})();
function save() { try { localStorage.setItem(STORE, JSON.stringify(progress)); } catch (e) { /* storage blocked */ } }
function questValue(q) {

  return progress.done[q.id] ? 1 : 0;
}
function renderQuests() {
  const list = $('quest-list'); list.innerHTML = '';
  let doneN = 0;
  for (const q of QUESTS) {
    const v = questValue(q), done = !!progress.done[q.id];
    if (done) doneN++;
    const li = document.createElement('li'); li.className = 'quest' + (done ? ' is-done' : ''); li.dataset.q = q.id;
    li.innerHTML = `<span class="check" aria-hidden="true"></span><span class="q-text">${q.text}</span>` +
      (q.goal > 1 ? `<span class="q-prog">${v}/${q.goal}</span>` : '');
    li.setAttribute('aria-label', `${q.text}${done ? ', done' : q.goal > 1 ? `, ${v} of ${q.goal}` : ''}`);
    list.appendChild(li);
  }
  $('quest-count').textContent = `${doneN} of ${QUESTS.length}`;

}

  if (progress.done[id]) return;
  progress.done[id] = true; save(); renderQuests();
  const q = QUESTS.find(q => q.id === id);
  toast(`Objective done: ${q.text.toLowerCase()}.`, 'done');
  const li = document.querySelector(`.quest[data-q="${id}"]`); if (li) li.classList.add('just-done');

      herd.forEach((c, i) => setTimeout(() => { c.dance(); burst(c.pos.clone().add(new THREE.Vector3(0, 0.6, 0)), 30, 0.7); }, i * 90));

const hintEl = $('hint');

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function pointerNDC(e) {
  const r = canvas.getBoundingClientRect();
  return ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
}
function catUnder(e) {
  ray.setFromCamera(pointerNDC(e), camera);
  const hit = ray.intersectObjects(herd.map(c => c.body), false)[0];
  return hit ? hit.object.userData.cat : null;
}
function sendTo(point) {
  addMarker(point);
  const crew = selectedCat ? [selectedCat] : herd.slice();
  crew.sort((a, b) => a.pos.distanceToSquared(point) - b.pos.distanceToSquared(point));
  crew.forEach((c, i) => {
    let p = point.clone();
    if (i > 0) {   // fan the herd out around the spot
      const r = 0.36 * Math.sqrt(i), a = i * 2.39996;
      const q = new THREE.Vector3(point.x + Math.cos(a) * r, 0, point.z + Math.sin(a) * r);
      const g = groundAt(q.x, q.z);

}
const ptr = { x: 0, y: 0, last: -99 };
const press = { at: null, cat: null, pet: 0, petted: false };
canvas.addEventListener('pointerdown', e => {
  press.at = { x: e.clientX, y: e.clientY, t: performance.now() };
  press.cat = walkables.length ? catUnder(e) : null; press.pet = 0; press.petted = false;
});
canvas.addEventListener('pointermove', e => {
  ptr.x = (e.clientX / innerWidth) * 2 - 1; ptr.y = -(e.clientY / innerHeight) * 2 + 1; ptr.last = clock.elapsedTime;
  if (press.at && Math.hypot(e.clientX - press.at.x, e.clientY - press.at.y) > 6) press.cat = null;   // it's a drag

canvas.addEventListener('pointerup', e => {
  if (!press.at || !walkables.length) return;
  const moved = Math.hypot(e.clientX - press.at.x, e.clientY - press.at.y), quick = performance.now() - press.at.t < 450;
  const petted = press.petted; press.at = null; press.cat = null;

  const c = catUnder(e);

  ray.setFromCamera(pointerNDC(e), camera);
  const hit = ray.intersectObjects(envMeshes, false)[0];
  if (!hit) { selectCat(null); return; }
  const g = groundAt(hit.point.x, hit.point.z);

  press.petted = true; press.pet = held - 0.4;
  if (c.mood !== 'purr') c.setMood('purr', 1.2); else c.mt = Math.min(c.mt, 0.3);   // keep purring while held

// WMO weather codes from Open-Meteo
function fromWmo(code, isDay, temp) {
  if (code >= 95) return 'storm';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if (!isDay) return 'night';
  if (temp >= 31) return 'heat';
  if (code <= 1) return 'sunny';
  return 'cloudy';
}
async function fetchWeather(lat, lon, label) {
  wxTitle.textContent = 'Checking the sky'; statusEl.textContent = 'One moment…';
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,is_day`;
    const r = await fetch(url); if (!r.ok) throw new Error(r.status);
    const c = (await r.json()).current;
    setWeather(fromWmo(c.weather_code, c.is_day, c.temperature_2m), label, Math.round(c.temperature_2m));
  } catch (e) {
    console.warn(e); setWeather(byClock(), "The weather service didn't answer, so this follows the clock.");
  }
}
function byClock() { const h = new Date().getHours(); return h < 6 || h >= 19 ? 'night' : 'sunny'; }
function useMyWeather() {
  if (!navigator.geolocation) { setWeather(byClock(), "This browser can't share a location, so this follows the clock."); return; }
  wxTitle.textContent = 'Finding you'; statusEl.textContent = 'Allow location to see your weather.';
  navigator.geolocation.getCurrentPosition(
    p => fetchWeather(p.coords.latitude.toFixed(3), p.coords.longitude.toFixed(3), 'Where you are.'),
    () => setWeather(byClock(), 'No location shared, so this follows the clock.'),
    { timeout: 8000, maximumAge: 30 * 60 * 1000 });
}
async function autoWeather() {
  const lat = qs.get('lat'), lon = qs.get('lon');
  if (lat && lon) return fetchWeather(lat, lon, 'At the place in the link.');
  try {
    const perm = await navigator.permissions?.query({ name: 'geolocation' });
    if (perm && perm.state === 'granted') return useMyWeather();
  } catch (e) { /* no permissions API */ }
  setWeather(byClock(), 'Following the clock.');
}

function snapWeather() {   // first frame: no easing

  Object.assign(cur, { fog: W.fog, hemi: W.hemi, sun: W.sun, clouds: W.clouds, rain: W.rain, snow: W.snow, stars: W.stars, disc: W.disc, moon: W.moon, snowCover: W.snow });

/* ---------- sky dressing: clouds, sun, moon, stars, rain, snow, lightning ---------- */
const cloudMat = toon('#ffffff');
const clouds = [];
for (let i = 0; i < 9; i++) {
  const g = new THREE.Group();
  const n = 4 + (i % 3);
  for (let k = 0; k < n; k++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(rand(0.55, 0.95), 14, 10), cloudMat);
    m.position.set((k - n / 2) * 0.9 + rand(-0.2, 0.2), rand(-0.1, 0.4) + (k % 2) * 0.3, rand(-0.3, 0.3)); m.scale.y = 0.75;
    g.add(m);
  }
  const a = (i / 9) * Math.PI * 2 + rand(-0.2, 0.2), r = rand(9.5, 13);
  g.userData = { a, r, y: rand(2.6, 4.6), speed: rand(0.015, 0.03), thresh: i / 9, s: 0 };
  g.scale.setScalar(0.001); g.visible = false; scene.add(g); clouds.push(g);
}
function discTexture(draw) { const c = document.createElement('canvas'); c.width = c.height = 128; draw(c.getContext('2d')); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const sunTex = discTexture(g => {
  const gr = g.createRadialGradient(64, 64, 10, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,248,214,1)'); gr.addColorStop(0.42, 'rgba(255,226,140,1)'); gr.addColorStop(0.46, 'rgba(255,210,140,0.45)'); gr.addColorStop(1, 'rgba(255,200,150,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});
const moonTex = discTexture(g => {
  const gr = g.createRadialGradient(64, 64, 20, 64, 64, 64); gr.addColorStop(0, 'rgba(255,246,214,0.35)'); gr.addColorStop(1, 'rgba(255,246,214,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  g.beginPath(); g.arc(64, 64, 26, 0, Math.PI * 2); g.fillStyle = '#fff3cf'; g.fill();
  g.fillStyle = 'rgba(214,200,160,0.6)'; [[54, 58, 5], [72, 70, 4], [62, 76, 3]].forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); });
});
const sunDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: sunTex, transparent: true, depthWrite: false, fog: false }));
const moonDisc = new THREE.Sprite(new THREE.SpriteMaterial({ map: moonTex, transparent: true, depthWrite: false, fog: false }));
sunDisc.scale.setScalar(16); moonDisc.scale.setScalar(13);
const _dir = new THREE.Vector3();
function pinToSky(obj, sx, sy, dist) {   // sx, sy in -1..1 screen space
  const ty = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));

}
scene.add(sunDisc, moonDisc);

const fx = {};
(function makeStars() {
  const n = 600, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = Math.random() * Math.PI * 2, ph = rand(0.08, 1.3), r = 80;

  }

  scene.add(fx.stars);
})();
const BOX_W = 18, BOX_H = 10, RAIN_N = 2400, SNOW_N = 1000;
(function makeRain() {
  const pos = new Float32Array(RAIN_N * 6), vel = new Float32Array(RAIN_N);
  for (let i = 0; i < RAIN_N; i++) {
    const x = rand(-BOX_W / 2, BOX_W / 2), y = rand(0, BOX_H), z = rand(-BOX_W / 2, BOX_W / 2);
    pos.set([x, y, z, x - 0.04, y - 0.3, z], i * 6); vel[i] = rand(9, 13);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

})();
(function makeSnow() {

  for (let i = 0; i < SNOW_N; i++) { pos.set([rand(-9, 9), rand(0, BOX_H), rand(-9, 9)], i * 3); vel[i] = rand(0.5, 1.1); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  fx.snow = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0, depthWrite: false }));
  fx.snow.userData.vel = vel; fx.snow.frustumCulled = false; scene.add(fx.snow);
})();
fx.storm = { flash: 0, nextFlash: rand(3, 6), bolt: null, boltT: 0 };
const flashEl = $('flash');
function lightning() {
  const S = fx.storm;
  S.flash = 1; S.nextFlash = rand(4, 9);
  // a jagged bolt from the clouds down to the island
  const end = randomSpot(0, 0, 6) || new THREE.Vector3(2, 0.5, 2);
  const pts = []; let p = new THREE.Vector3(end.x + rand(-2, 2), 11, end.z + rand(-2, 2));
  for (let i = 0; i <= 9; i++) {
    const q = i / 9; pts.push(new THREE.Vector3(THREE.MathUtils.lerp(p.x, end.x, q) + (i && i < 9 ? rand(-0.5, 0.5) : 0), THREE.MathUtils.lerp(p.y, end.y, q), THREE.MathUtils.lerp(p.z, end.z, q) + (i && i < 9 ? rand(-0.5, 0.5) : 0)));
  }
  if (S.bolt) { scene.remove(S.bolt); S.bolt.geometry.dispose(); }
  S.bolt = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xfff6c8, transparent: true, fog: false }));
  S.boltT = 0.22; scene.add(S.bolt);
  if (!REDUCED) { flashEl.classList.remove('is-on'); void flashEl.offsetWidth; flashEl.classList.add('is-on'); }
  herd.forEach((c, i) => setTimeout(() => { if (c !== coolCat) c.setMood('surprised', 0.9); c.jump(0.7); }, 160 + i * 15));
}
const _white = new THREE.Color(0xffffff), _tmpC = new THREE.Color();
function updateSky(t, dt) {
  const W = WEATHER[weatherKey], k = 1 - Math.exp(-2.2 * dt), k2 = 1 - Math.exp(-1.2 * dt);
  cur.top.lerp(goal.top, k); cur.bottom.lerp(goal.bottom, k);
  cur.sunColor.lerp(goal.sunColor, k); cur.cloudCol.lerp(goal.cloudCol, k); cur.ambient.lerp(goal.ambient, k);
  for (const key of ['fog', 'hemi', 'sun', 'clouds', 'rain', 'snow', 'stars', 'disc', 'moon']) cur[key] += (W[key] - cur[key]) * k;
  cur.snowCover += (W.snow - cur.snowCover) * k2 * 0.6;
  // storm flashes
  const S = fx.storm;
  if (weatherKey === 'storm') { S.nextFlash -= dt; if (S.nextFlash <= 0) lightning(); }
  S.flash = Math.max(0, S.flash - dt * 3);
  if (S.bolt) { S.boltT -= dt; S.bolt.material.opacity = clamp01(S.boltT / 0.22 * (0.6 + 0.4 * Math.sin(t * 90))); if (S.boltT <= 0) { scene.remove(S.bolt); S.bolt.geometry.dispose(); S.bolt = null; } }

  skyU.uTop.value.copy(cur.top).lerp(_white, S.flash * 0.5);
  skyU.uBottom.value.copy(cur.bottom).lerp(_white, S.flash * 0.6);
  scene.fog.color.copy(cur.bottom); scene.fog.density = cur.fog;
  hemi.intensity = cur.hemi + S.flash * 2.5; sun.intensity = cur.sun; sun.color.copy(cur.sunColor);
  AMBIENT.copy(cur.ambient);
  // snow settles on the pond: everything goes pale, water goes icy blue
  for (const m of snowMats) m.color.copy(m.userData.base).lerp(_white, cur.snowCover * 0.55);
  if (waterMat) waterMat.color.copy(waterMat.userData.base).lerp(_tmpC.set('#d6eef8'), cur.snowCover * 0.6);
  // clouds pop in one by one and drift
  cloudMat.color.copy(cur.cloudCol);
  for (const c of clouds) {
    const u = c.userData;
    // only clouds on the far side of the island, never between you and the cats
    const toCloud = _dir.subVectors(c.position, camera.position), toCentre = _p.subVectors(controls.target, camera.position);
    const behind = toCloud.length() > toCentre.length() + 3 && toCloud.normalize().dot(toCentre.normalize()) > 0.35;
    u.s = damp(u.s, cur.clouds > u.thresh + 0.02 && behind ? 1 : 0, 2.5, dt);
    c.visible = u.s > 0.01; c.scale.setScalar(Math.max(0.001, easeOut(u.s)));
    u.a += u.speed * dt;
    c.position.set(Math.cos(u.a) * u.r, u.y + Math.sin(t * 0.3 + u.a * 3) * 0.2, Math.sin(u.a) * u.r);

  sunDisc.material.opacity = clamp01(cur.disc); sunDisc.scale.setScalar(14 + cur.disc * 5 + Math.sin(t * 1.5) * 0.4); sunDisc.visible = cur.disc > 0.01;
  moonDisc.material.opacity = clamp01(cur.moon); moonDisc.visible = cur.moon > 0.01;
  fx.stars.material.opacity = cur.stars * (0.75 + 0.25 * Math.sin(t * 2)); fx.stars.visible = cur.stars > 0.01;
  // rain
  const rainOn = cur.rain > 0.01; fx.rain.visible = rainOn && !REDUCED;
  if (fx.rain.visible) {
    const a = fx.rain.geometry.attributes.position.array, vel = fx.rain.userData.vel, wind = weatherKey === 'storm' ? 0.12 : 0.04;
    const n = Math.floor(RAIN_N * Math.min(1, cur.rain + 0.05)); fx.rain.geometry.setDrawRange(0, n * 2);
    for (let i = 0; i < n; i++) {
      let y = a[i * 6 + 1] - vel[i] * dt * (0.8 + cur.rain * 0.4);
      if (y < 0) { y += BOX_H; const x = rand(-BOX_W / 2, BOX_W / 2), z = rand(-BOX_W / 2, BOX_W / 2); a[i * 6] = x; a[i * 6 + 2] = z; }
      a[i * 6 + 1] = y; a[i * 6 + 3] = a[i * 6] - wind * 3; a[i * 6 + 4] = y - 0.3; a[i * 6 + 5] = a[i * 6 + 2];

      const y = a[i * 3 + 1] - vel[i] * dt; a[i * 3] += Math.sin(t * 0.8 + i) * 0.004;
      a[i * 3 + 1] = y < 0 ? y + BOX_H : y;
    }

}

/* ================================================================
   Herd brain
   ================================================================ */
const BEHAVIOUR = {
  happy:   { gap: [2, 5],  wander: 0.45, roll: 0.2,  jump: 0.2,  laugh: 0.15, range: 3, fish: 0.5 },
  neutral: { gap: [3, 7],  wander: 0.6,  roll: 0.05, jump: 0.1,  laugh: 0,    range: 2.5, fish: 0.35 },
  sad:     { gap: [5, 10], wander: 0.3,  roll: 0,    jump: 0,    laugh: 0,    range: 1.5, fish: 0.1 },
  angry:   { gap: [2, 4],  wander: 0.5,  roll: 0,    jump: 0.45, laugh: 0,    range: 3, fish: 0.3 },
  cold:    { gap: [2, 5],  wander: 0.7,  roll: 0,    jump: 0.2,  laugh: 0,    range: 1.2, huddle: true, fish: 0.2 },
  sleepy:  { gap: [6, 12], wander: 0.15, roll: 0,    jump: 0,    laugh: 0,    range: 1.5, fish: 0.08 },
};
const _d = new THREE.Vector3(), _push = new THREE.Vector3(), _c = new THREE.Vector3(), _p = new THREE.Vector3();
function think(c) {
  const B = BEHAVIOUR[herdMood] || BEHAVIOUR.neutral;
  c.thinkT = rand(B.gap[0], B.gap[1]);
  const f = nearestFish(c);
  if (f && Math.random() < B.fish) { c.goTo(f.position); return; }   // something smells good
  const r = Math.random();
  if (r < B.wander) {
    let cx = c.pos.x, cz = c.pos.z;
    if (B.huddle) { _c.set(0, 0, 0); herd.forEach(o => _c.add(o.pos)); _c.divideScalar(herd.length); cx = _c.x; cz = _c.z; }   // cold cats huddle
    const p = randomSpot(cx, cz, B.range); if (p) c.goTo(p);
  } else if (r < B.wander + B.roll) c.doRoll();
  else if (r < B.wander + B.roll + B.jump) c.jump(herdMood === 'angry' ? 0.6 : 1);
  else if (r < B.wander + B.roll + B.jump + B.laugh) c.setMood('laugh', 2);
}
function tryMove(c, nx, nz) { if (groundAt(nx, nz)) { c.pos.x = nx; c.pos.z = nz; return true; } return false; }

function updateHerd(t, dt) {
  const tracking = t - ptr.last < 3;
  let rolling = 0, swimming = 0;
  for (const c of herd) {
    if (!c.target && c.onGround && c.rollT < 0 && press.cat !== c) { c.thinkT -= dt; if (c.thinkT <= 0) think(c); }
    const speedMood = c === coolCat ? 1.2 : (MOOD_SPEED[herdMood] || 1);
    let wantMove = 0;
    if (c.target) {
      _d.subVectors(c.target, c.pos); _d.y = 0;
      const dist = _d.length();
      if (dist < 0.08) {
        c.target = null;
        if (herdMood === 'happy' || c === coolCat) c.jump(0.6);
      } else {
        const sp = 1.7 * speedMood * clamp(dist * 2, 0.4, 1);
        _d.normalize();
        const step = Math.min(sp * dt, dist);
        if (!tryMove(c, c.pos.x + _d.x * step, c.pos.z + _d.z * step)) c.target = null;
        let dy = Math.atan2(_d.x, _d.z) - c.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
        c.yaw += dy * (1 - Math.exp(-10 * dt));
        wantMove = 1;
        c.runPhase += dt * 13 * Math.sqrt(speedMood);
      }
    }
    if (c.rollT >= 0) {   // forward roll
      rolling++;
      c.rollT += dt; const q = c.rollT / 0.8;
      if (q >= 1) { c.rollT = -1; c.roll.rotation.x = 0; }
      else {
        c.roll.rotation.x = Math.PI * 2 * easeInOut(q);
        const f = Math.sin(q * Math.PI) * 2.6 * dt;
        tryMove(c, c.pos.x + Math.sin(c.yaw) * f, c.pos.z + Math.cos(c.yaw) * f);
      }

    c.move = damp(c.move, wantMove, 8, dt);
    _push.set(0, 0, 0);   // personal space
    for (const o of herd) {
      if (o === c) continue;
      const dx = c.pos.x - o.pos.x, dz = c.pos.z - o.pos.z, d2 = dx * dx + dz * dz;
      if (d2 < 0.36 && d2 > 1e-6) { const d = Math.sqrt(d2); _push.x += dx / d * (0.6 - d); _push.z += dz / d * (0.6 - d); }
    }
    if (_push.x || _push.z) tryMove(c, c.pos.x + _push.x * dt * 4, c.pos.z + _push.z * dt * 4);
    // height: follow the ground, hop up ledges, fall with gravity

      const gy = g.y - (g.water ? 0.05 : 0);

      if (c.onGround) {
        const diff = gy - c.pos.y;
        if (diff > 0.22) { c.vy = Math.sqrt(2 * GRAV * (diff + 0.12)); c.onGround = false; }
        else if (diff < -0.12) c.onGround = false;
        else c.pos.y = damp(c.pos.y, gy, 20, dt);
      }
      if (!c.onGround) {
        c.vy -= GRAV * dt; c.pos.y += c.vy * dt;
        if (c.pos.y <= gy && c.vy <= 0) { c.pos.y = gy; c.vy = 0; c.onGround = true; if (c.inWater) addRipple(c.pos); }
      }
      if (c.inWater && c.move > 0.3) { c.rippleT -= dt; if (c.rippleT <= 0) { addRipple(c.pos); c.rippleT = 0.28; } }
      if (c.inWater) swimming++;
      if (c.onGround && c.pos.y > 2.0) complete('skull');
    }
    c.root.rotation.y = c.yaw;
    c.root.updateMatrixWorld();
    let tgt = c.rest;
    if (c.move > 0.4) tgt = _v2b.set(0, 0.15);
    else if (tracking) {
      const s = _p.set(0, 1.75, 0).applyMatrix4(c.root.matrixWorld).project(camera);
      const dx = (ptr.x - s.x) * camera.aspect, dy = ptr.y - s.y;
      const len = Math.hypot(dx, dy) || 1, k = Math.min(1, len * 2.4) / len;

}

/* ================================================================
   Loop
   ================================================================ */
const clock = new THREE.Clock();
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; skyU.uH.value = h * renderer.getPixelRatio();
  camera.fov = w / h < 0.8 ? 55 : 38; camera.updateProjectionMatrix();
  document.documentElement.style.setProperty('--dock-h', document.querySelector('.dock').offsetHeight + 'px');
}
addEventListener('resize', resize); resize();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  controls.update();
  sky.position.copy(camera.position);
  if (walkables.length) {
    updateSky(t, dt);
    updatePetting(dt);
    updateHerd(t, dt);
    updateFish(t, dt);
    fade(markers, dt, 0.9, 1.6, 1, 1); fade(ripples, dt, 1.1, 1.6, 0.4, 0.8);
    updateBursts(dt); updateHearts(dt);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
loop();
window.__blob = { herd, setCount, setWeather, ACTIONS, sendTo, groundAt, selectCat, complete, progress, fishes, spawnFish };
